name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Formula
        run: |
          # Get the new version from the dispatch payload or fetch latest release
          VERSION="${{ github.event.client_payload.version }}"

          # If VERSION is empty, fetch the latest release from GitHub
          if [ -z "$VERSION" ]; then
            echo "No version provided in payload, fetching latest release..."
            VERSION=$(curl -s https://api.github.com/repos/dtg01100/dcutil/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')

            if [ -z "$VERSION" ]; then
              echo "❌ Error: Could not determine version from payload or latest release"
              exit 1
            fi
            echo "Using latest release version: $VERSION"
          else
            echo "Using version from payload: $VERSION"
          fi

          echo "Updating to version $VERSION"

          # Download the tarball and calculate SHA256
          TARBALL_URL="https://github.com/dtg01100/dcutil/archive/refs/tags/${VERSION}.tar.gz"
          echo "Downloading tarball from: $TARBALL_URL"

          SHA256=$(curl -sL "$TARBALL_URL" | sha256sum | cut -d' ' -f1)

          if [ -z "$SHA256" ] || [ "$SHA256" = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" ]; then
            echo "❌ Error: Failed to download tarball or empty file"
            exit 1
          fi

          echo "SHA256: $SHA256"

          # Update the formula
          sed -i "s|url \".*\"|url \"$TARBALL_URL\"|" Formula/dcutil.rb
          sed -i "s|sha256 \".*\"|sha256 \"$SHA256\"|" Formula/dcutil.rb

          # Show the updated formula
          cat Formula/dcutil.rb

      - name: Commit and Push
        run: |
          # Get VERSION from environment or fetch latest
          VERSION="${{ github.event.client_payload.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -s https://api.github.com/repos/dtg01100/dcutil/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          fi

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Formula/dcutil.rb
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update dcutil to $VERSION"
            git push
          fi